name: Smart Money · registro diario

on:
  schedule:
    # 00:20 UTC = 21:20 ART, después del cierre de la vela diaria
    - cron: '20 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: smart-money-registro
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Foto del día
        run: node scripts/smart-money/registrar.mjs

      - name: Evaluar registros anteriores
        run: node scripts/smart-money/evaluar.mjs

      - name: Guardar en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/smart-money
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "smart-money: registro $(date -u +%F)"
          # otro Action (Radar de Altcoins) también escribe en datos/: reintenta si el push choca
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
